name: Build the Cloudflare judge image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build the keyless judge image
        run: docker build --platform linux/amd64 --tag racelab-judge:ci .
      - name: Publish with temporary registry credentials
        env:
          REGISTRY_USER: ${{ secrets.RACELAB_CF_REGISTRY_TEMP_USER }}
          REGISTRY_TOKEN: ${{ secrets.RACELAB_CF_REGISTRY_TEMP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_TOKEN"
          printf '%s' "$REGISTRY_TOKEN" | docker login registry.cloudflare.com --username "$REGISTRY_USER" --password-stdin
          image="registry.cloudflare.com/d47271b1aef2b6971cc6a3640faf4edc/racelab-judge-runner"
          docker tag racelab-judge:ci "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          digest=$(docker image inspect "$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          printf 'RACELAB_IMAGE=%s\n' "$digest"
          printf 'Source: `%s`\n\nImage: `%s`\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
          docker logout registry.cloudflare.com
